name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and check generated files
    # Pure static analysis + metadata generation - no package needs to be
    # installed to run these.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync workspace root (dev deps only)
        run: uv sync

      - name: Check generated files are up to date
        run: uv run python scripts/gen_marketplace.py --check

      - name: Ruff lint
        run: uv run ruff check packages/

      - name: Ruff format check
        run: uv run ruff format --check packages/

  test-linux:
    name: Test (Linux packages)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync workspace packages
        # Every workspace member. --extra dashboard so ynab-tools' dashboard
        # deps (fastapi, uvicorn) are present for its tests.
        run: |
          uv sync --extra dashboard \
            --package mrlesmithjr-mcp-common \
            --package mrlesmithjr-mcp-ynab-tools

      - name: Run tests
        # One pytest invocation PER package, not a combined multi-path run.
        # Many packages share the literal filename tests/test_mcp_server.py,
        # and --import-mode=importlib does not fully prevent collection
        # collisions across them when collected together in one session
        # (see #96 - confirmed real tests silently missing from combined
        # collection). Running each package alone sidesteps that entirely,
        # regardless of #96's root cause.
        run: |
          set -e
          for pkg in mcp-common ynab-tools; do
            echo "::group::pytest packages/$pkg"
            uv run pytest packages/$pkg -v
            echo "::endgroup::"
          done
