[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mrlesmithjr-mcp-homeops-coordinator"
version = "0.1.11"
description = "Event-driven coordinator daemon for cross-system homeops sync"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Larry Smith Jr" },
]
dependencies = [
    "mrlesmithjr-mcp-apple-eventkit-tools",
    "mrlesmithjr-mcp-lawnops",
]

[project.scripts]
homeops-coordinator = "coordinator.__main__:main"

[tool.setuptools.packages.find]
include = ["coordinator*"]

[tool.uv.sources]
mrlesmithjr-mcp-apple-eventkit-tools = { workspace = true }
mrlesmithjr-mcp-lawnops = { workspace = true }

[tool.bumpversion]
current_version = "0.1.11"
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
