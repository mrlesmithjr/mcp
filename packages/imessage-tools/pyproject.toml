[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mrlesmithjr-mcp-imessage-tools"
version = "0.1.8"
description = "iMessage MCP server: read chats from chat.db, send via AppleScript"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Larry Smith Jr" },
]
keywords = ["imessage", "messages", "macos", "sqlite", "applescript", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "mrlesmithjr-mcp-common>=0.1.0",
    "mcp>=1.0",
    "pyobjc-framework-Contacts>=10.0",
]

[project.urls]
Homepage = "https://github.com/mrlesmithjr/imessage-tools"
Repository = "https://github.com/mrlesmithjr/imessage-tools"
Issues = "https://github.com/mrlesmithjr/imessage-tools/issues"


[project.scripts]
imessage-mcp = "imessage_tools.mcp_server:main"

[tool.setuptools.packages.find]
include = ["imessage_tools*"]

[tool.bumpversion]
current_version = "0.1.3"
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
