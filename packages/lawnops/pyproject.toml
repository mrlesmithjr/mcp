[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mrlesmithjr-mcp-lawnops"
version = "1.0.51"
description = "Lawn care operations CLI: weather monitoring, irrigation control, treatment tracking, and cost management"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Larry Smith Jr" },
]
keywords = ["lawn-care", "irrigation", "hydrawise", "soil-temperature", "yard-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = [
    "mrlesmithjr-mcp-common>=0.1.0",
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "pydrawise>=2026.4.0,<2027",
    "beautifulsoup4>=4.12.0",
    "mcp>=1.0,<2",
]

[project.optional-dependencies]

[project.scripts]
lawnops = "lawnops.cli:main"
lawnops-mcp = "lawnops.mcp_server:main"

[tool.setuptools.packages.find]
include = ["lawnops*"]

[tool.bumpversion]
current_version = "1.0.33"
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
