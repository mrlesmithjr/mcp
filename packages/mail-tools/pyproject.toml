[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mrlesmithjr-mcp-mail-tools"
version = "0.1.35"
description = "Apple Mail MCP server: read, search, and compose email across all accounts via ScriptingBridge"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Larry Smith Jr" },
]
keywords = ["apple-mail", "email", "macos", "scriptingbridge", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
]
dependencies = [
    "mrlesmithjr-mcp-common>=0.1.0",
    "pyobjc-framework-ScriptingBridge>=10.0",
    "mcp>=1.0,<2",
    "prompt-security-utils>=1.4.0",
]

[project.optional-dependencies]

[project.scripts]
mail-mcp = "mail_tools.mcp_server:main"

[tool.setuptools.packages.find]
include = ["mail_tools*"]

[project.urls]
Homepage = "https://github.com/mrlesmithjr/mail-tools"
Repository = "https://github.com/mrlesmithjr/mail-tools"
Issues = "https://github.com/mrlesmithjr/mail-tools/issues"

[tool.bumpversion]
current_version = "0.1.8"
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
