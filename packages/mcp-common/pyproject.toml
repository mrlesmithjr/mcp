[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mrlesmithjr-mcp-common"
version = "0.1.2"
description = "Shared utilities for mrlesmithjr MCP servers: logging, config, paths, errors"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Larry Smith Jr", email = "mrlesmithjr@gmail.com" }]
keywords = ["mcp", "claude", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/mrlesmithjr/mcp"
Repository = "https://github.com/mrlesmithjr/mcp"
"Bug Tracker" = "https://github.com/mrlesmithjr/mcp/issues"

[tool.setuptools.packages.find]
include = ["mcp_common*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
