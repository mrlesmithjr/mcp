[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mrlesmithjr-mcp-unifi-tools"
version = "0.1.27"
description = "UniFi network operations: device inventory, client monitoring, VLAN management, and security status"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Larry Smith Jr" },
]
keywords = ["unifi", "network", "udm", "home-automation", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = [
    "mrlesmithjr-mcp-common>=0.1.0",
    "requests>=2.28.0",
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]

[project.urls]
Homepage = "https://git.methodicalcloud.com/mrlesmithjr/unifi-tools"
Repository = "https://git.methodicalcloud.com/mrlesmithjr/unifi-tools"

[project.scripts]
unifi-tools = "unifi.cli:main"
unifi-mcp = "unifi.mcp_server:main"

[tool.setuptools.packages.find]
include = ["unifi*"]

[tool.ruff]
line-length = 120

[tool.mypy]
python_version = "3.10"
strict = true

[tool.bumpversion]
current_version = "0.1.22"
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
