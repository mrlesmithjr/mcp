[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mrlesmithjr-mcp-ynab-tools"
version = "1.0.386"
description = "YNAB budget data sync, payee management, and financial analysis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Larry Smith Jr.", email = "mrlesmithjr@gmail.com"},
]
keywords = ["ynab", "budget", "finance", "payee", "sync"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "mrlesmithjr-mcp-common>=0.1.0",
    "requests>=2.28",
    "mcp>=1.0,<2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.16.2",
    "pre-commit>=4.0",
]
dashboard = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]

[project.urls]
Homepage = "https://github.com/mrlesmithjr/ynab-tools"
Repository = "https://github.com/mrlesmithjr/ynab-tools"
Issues = "https://github.com/mrlesmithjr/ynab-tools/issues"
Changelog = "https://github.com/mrlesmithjr/ynab-tools/blob/main/CHANGELOG.md"

[project.scripts]
ynab = "ynab_tools.cli:main"
ynab-mcp = "ynab_tools.mcp_server:main"
ynab-dashboard = "ynab_tools.dashboard.server:main"

[tool.setuptools.packages.find]
include = ["ynab_tools*"]

[tool.setuptools.package-data]
ynab_tools = ["data/*", "dashboard/frontend/dist/**/*", "dashboard/frontend/dist/*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.bumpversion]
current_version = "1.0.370"
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
